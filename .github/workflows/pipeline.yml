name: BaliFuel Data Pipeline Runner

on:
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore State Database from R2
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -n "$WORKER_URL" ] && [ -n "$INGEST_TOKEN" ]; then
            python src/publish.py --restore-state --worker-url "$WORKER_URL" --token "$INGEST_TOKEN"
          else
            echo "::warning::WORKER_URL or INGEST_TOKEN not set. Bootstrapping state fresh."
          fi

      - name: Run Pipeline & Publish Contracts
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
        run: |
          if [ -n "$WORKER_URL" ] && [ -n "$INGEST_TOKEN" ]; then
            python run_pipeline.py --publish --worker-url "$WORKER_URL" --token "$INGEST_TOKEN"
          else
            echo "::warning::Running in dry-run mode because credentials are not configured."
            python run_pipeline.py --dry-run
          fi

      - name: Compact & Save State Database to R2
        if: always()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          if [ -n "$WORKER_URL" ] && [ -n "$INGEST_TOKEN" ]; then
            python src/publish.py --save-state --worker-url "$WORKER_URL" --token "$INGEST_TOKEN"
          fi
      - name: Runner Debug & Freshness Audit
        if: always()
        run: |
          python src/debug_runner.py
